# Portable template: install.sh expands ~/ into the local home directory.
# Closest Codex equivalent to Claude Code's automatic permission mode:
# operate inside the workspace sandbox and auto-review eligible escalations.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "workspace-with-private-dirs"

[permissions.workspace-with-private-dirs]
description = "Workspace access with Documents and Dropbox denied."
extends = ":workspace"

[permissions.workspace-with-private-dirs.filesystem]
"~/Documents" = "deny"
"~/Dropbox" = "deny"

[tui]
alternate_screen = "always"
status_line = ["model-with-reasoning", "current-dir", "context-remaining", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
